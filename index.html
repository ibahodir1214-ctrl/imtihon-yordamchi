<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3fa6">
<title>Malaka oshirish testlari</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: one left-aligned column; a lapis "hero" band, then lists of rows (not card grids). Lapis = action, turquoise = progress. */
:root{
  --bg:#f2f5f8;--surface:#ffffff;--sunk:#e8edf2;--ink:#0f1d2e;--mut:#56657a;--line:#d9e1e9;
  --pri:#1f3fa6;--pri-ink:#ffffff;--pri-soft:#e5eafa;--acc:#0a8a85;--acc-soft:#dff3f1;
  --ok:#11795a;--ok-soft:#e0f3ea;--bad:#be342d;--bad-soft:#fbe8e6;--warn:#9a5a08;--warn-soft:#faefd9;
  --hero1:#1f3fa6;--hero2:#14296f;--hero-ink:#ffffff;--hero-mut:#c3cff3;
  --shadow:0 1px 0 rgba(15,29,46,.04),0 8px 24px -12px rgba(15,29,46,.18);
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Unbounded","Golos Text",system-ui,sans-serif;
  --r-lg:22px;--r-md:16px;--r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --bg:#0c131c;--surface:#141e2a;--sunk:#1a2634;--ink:#e5ecf4;--mut:#95a5b8;--line:#243448;
  --pri:#86a2ff;--pri-ink:#0c131c;--pri-soft:#1b2a4c;--acc:#40c9c0;--acc-soft:#123331;
  --ok:#4fca97;--ok-soft:#11302a;--bad:#f2807a;--bad-soft:#3a1d1d;--warn:#f0b54f;--warn-soft:#3a2b12;
  --hero1:#1d3480;--hero2:#101f4d;--hero-ink:#ffffff;--hero-mut:#aebde9;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6)}}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#0c131c;--surface:#141e2a;--sunk:#1a2634;--ink:#e5ecf4;--mut:#95a5b8;--line:#243448;
  --pri:#86a2ff;--pri-ink:#0c131c;--pri-soft:#1b2a4c;--acc:#40c9c0;--acc-soft:#123331;
  --ok:#4fca97;--ok-soft:#11302a;--bad:#f2807a;--bad-soft:#3a1d1d;--warn:#f0b54f;--warn-soft:#3a2b12;
  --hero1:#1d3480;--hero2:#101f4d;--hero-ink:#ffffff;--hero-mut:#aebde9;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.wrap{max-width:var(--mw,100%);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:20px 120px}
@media(min-width:900px){main.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
@media(min-width:900px){header.top .wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--hero1),var(--hero2));display:grid;place-items:center;flex:none;color:#fff;font:600 13px var(--f-disp)}
.ttl{font:600 16px/1.2 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ib{width:42px;height:42px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{border-color:var(--pri)}
.ib.txt{font:700 14px var(--f-ui)}
.timer{display:flex;align-items:center;gap:6px;font:600 15px var(--f-disp);font-variant-numeric:tabular-nums;padding:9px 13px;border-radius:999px;background:var(--pri-soft);color:var(--pri)}
.timer.low{background:var(--bad-soft);color:var(--bad)}

/* type */
h1{font:600 clamp(26px,4.4vw,40px)/1.12 var(--f-disp);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:600 19px/1.3 var(--f-ui);margin:32px 0 12px;letter-spacing:-.01em}
.mut{color:var(--mut)}.sm{font-size:14px}
p{margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;transition:border-color .15s,background .15s,transform .08s;text-decoration:none}
.btn:hover{border-color:var(--pri)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.p:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
:focus-visible{outline:2.5px solid var(--pri);outline-offset:2px}

/* hero */
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--r-lg);background:linear-gradient(150deg,var(--hero1),var(--hero2));color:var(--hero-ink);padding:28px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.hero::after{content:"";position:absolute;left:-70px;bottom:-90px;width:280px;height:280px;opacity:.10;background:
  conic-gradient(from 45deg,#fff 0 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/52px 52px;
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);pointer-events:none;z-index:-1}
.hero .lead{color:var(--hero-mut);margin-top:10px;max-width:46ch}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%}
.ring .rt{fill:none;stroke:rgba(255,255,255,.16);stroke-width:10}
.ring .rv{fill:none;stroke:#5fe0d6;stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .6s}
.ring-tx{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-tx b{font:600 26px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.ring-tx span{font-size:12px;color:var(--hero-mut);margin-top:4px}
@media(max-width:560px){.hero{grid-template-columns:1fr;padding:22px}.ring{width:112px;height:112px}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow)}
.stats>div{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats>div+div{border-left:1px solid var(--line)}
.stats b{font:600 22px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--mut)}

/* big actions */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:700px){.acts{grid-template-columns:1fr}}
.act{display:flex;align-items:center;gap:16px;text-align:left;padding:20px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s,transform .15s}
.act:hover{border-color:var(--pri);transform:translateY(-1px)}
.act-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none}
.act-ic svg.i{width:26px;height:26px}
.act-learn .act-ic{background:var(--acc-soft);color:var(--acc)}
.act-test .act-ic{background:var(--pri-soft);color:var(--pri)}
.act-tx{flex:1;min-width:0}.act-tx b{display:block;font:600 18px/1.25 var(--f-ui)}
.act-tx span{display:block;font-size:14px;color:var(--mut);margin-top:4px}
.act>svg.i:last-child{color:var(--mut)}

.quick{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.quick .btn{flex:1;min-width:220px;justify-content:flex-start}
.quick .btn .cnt{margin-left:auto;font:600 13px var(--f-disp);padding:3px 9px;border-radius:999px;background:var(--sunk)}

/* list rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.row-i{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;text-align:left;background:none;border:0}
.list>.row-i+.row-i,.list>.mrow+.mrow{border-top:1px solid var(--line)}
button.row-i{cursor:pointer}button.row-i:hover{background:var(--sunk)}
.row-i .tx{flex:1;min-width:0}.row-i .tx b{display:block;font-weight:600}
.row-i .tx span{font-size:13.5px;color:var(--mut)}
.score-pill{font:600 14px var(--f-disp);font-variant-numeric:tabular-nums;padding:6px 11px;border-radius:999px;flex:none}
.sp-ok{background:var(--ok-soft);color:var(--ok)}.sp-mid{background:var(--warn-soft);color:var(--warn)}.sp-bad{background:var(--bad-soft);color:var(--bad)}

.mrow{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:18px}
.mnum{width:40px;height:40px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font:600 15px var(--f-disp);grid-row:span 2}
.mtx{min-width:0}.mtx b{display:block;font-weight:600;line-height:1.35}.mtx span{font-size:13.5px;color:var(--mut)}
.mact{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.mact .btn{min-height:44px;padding:8px 14px;flex-direction:column;gap:0;line-height:1.2}
.mact .btn small{font-weight:400;font-size:12px;color:var(--mut)}
.mact .btn.p small{color:inherit;opacity:.8}
.cnum{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);overflow:hidden;flex:1;min-width:230px}
.cnum:focus-within{border-color:var(--pri)}
.cnum input{width:84px;border:0;background:transparent;padding:0 12px;font:600 16px var(--f-disp);font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield}
.cnum input::-webkit-outer-spin-button,.cnum input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cnum .hint{flex:1;display:flex;align-items:center;font-size:13px;color:var(--mut);padding-right:8px;white-space:nowrap}
.cnum .btn{border:0;border-left:1px solid var(--line);border-radius:0;min-height:44px}
.cnum.err{border-color:var(--bad)}.cnum.err .hint{color:var(--bad)}
@media(max-width:899px){.mact{grid-column:1/-1}.mact>.btn{flex:1}}
@media(min-width:900px){.mrow{grid-template-columns:auto 1fr auto;align-items:center}.mnum{grid-row:auto}.mact{flex-wrap:nowrap}.cnum{flex:none}}

.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}

/* feature (general test) */
.feature{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:22px;border-radius:var(--r-md);background:linear-gradient(150deg,var(--hero1),var(--hero2));color:var(--hero-ink)}
.feature b{display:block;font:600 21px/1.25 var(--f-disp)}
.feature p{color:var(--hero-mut);margin-top:6px;font-size:15px}
.feature .btn{background:#fff;color:#1f3fa6;border-color:#fff}
@media(max-width:560px){.feature{grid-template-columns:1fr}}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--hero-ink);margin-bottom:10px}

/* exam */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qn{font:600 14px var(--f-ui);color:var(--mut)}.qn b{font:600 22px var(--f-disp);color:var(--ink)}
.prog{height:4px;background:var(--sunk);border-radius:4px;margin:10px 0 18px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri);transition:width .25s}
.modtag{display:inline-block;font-size:13px;font-weight:600;color:var(--acc);background:var(--acc-soft);padding:4px 10px;border-radius:999px;margin-bottom:12px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow)}
.q{font:600 clamp(18px,2.1vw,22px)/1.45 var(--f-ui);margin:0 0 18px;letter-spacing:-.005em}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .12s,background .12s;line-height:1.45}
.opt:not(:disabled):hover{border-color:var(--pri);background:var(--pri-soft)}
.opt .l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font:600 13px var(--f-disp);background:var(--sunk);color:var(--mut);margin-top:-2px}
.opt .ot{flex:1;min-width:0;padding-top:1px}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}.opt.sel .l{background:var(--pri);color:var(--pri-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .l{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}.opt.no .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
details.map{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:4px 18px}
details.map summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.map summary::-webkit-details-marker{display:none}
details.map[open] summary svg{transform:rotate(90deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;padding-bottom:14px}
.grid button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 13px var(--f-ui);font-variant-numeric:tabular-nums;cursor:pointer}
.grid .a{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.grid .cur{outline:2px solid var(--pri);outline-offset:1px}
.grid .g{background:var(--ok-soft);border-color:transparent;color:var(--ok)}.grid .r{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

/* footer action bar */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.foot .in{max-width:var(--mw,100%);margin:0 auto;display:flex;gap:10px}.foot .btn{flex:1}

/* result */
.result{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding:24px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.result .ring .rt{stroke:var(--sunk)}.result .ring .rv{stroke:var(--gc)}
.result .ring-tx b{color:var(--gc)}.result .ring-tx span{color:var(--mut)}
.result .gname{font:600 22px/1.2 var(--f-disp);color:var(--gc)}
.result .meta{color:var(--mut);margin-top:6px;font-size:14px}
.result .nums{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.result .nums div{display:flex;flex-direction:column}.result .nums b{font:600 20px var(--f-disp);font-variant-numeric:tabular-nums}.result .nums span{font-size:13px;color:var(--mut)}
@media(max-width:520px){.result{grid-template-columns:1fr;text-align:left}}
.seg{display:inline-flex;padding:4px;border-radius:var(--r-sm);background:var(--sunk);gap:4px;margin:4px 0 12px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rv-i{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;margin-top:10px}
.rv-i .q{font-size:17px;margin:8px 0 10px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px}
.st svg.i{width:15px;height:15px}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.no{background:var(--bad-soft);color:var(--bad)}.st.nt{background:var(--sunk);color:var(--mut)}
.ans{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);margin-top:6px;font-size:15px}
.ans svg.i{margin-top:2px;width:18px;height:18px}
.ans.ok{background:var(--ok-soft);color:var(--ok)}.ans.no{background:var(--bad-soft);color:var(--bad)}
.tip{background:var(--warn-soft);border-radius:var(--r-sm);padding:12px 14px;margin-top:8px;font-size:14.5px}
.tip b{color:var(--warn)}.tip ul{margin:6px 0 0;padding-left:18px}.tip li{margin:3px 0}
mark{background:#fde68a;color:#1a1a1a;border-radius:3px;padding:0 2px}

/* learn */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:0 14px;min-height:46px}
.search:focus-within{border-color:var(--pri)}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;font-size:15px}
.search svg.i{color:var(--mut)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--pri)}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-top:12px}
.lc-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qno{font:600 13px var(--f-disp);color:var(--mut)}
.done-badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--acc)}
.done-badge svg.i{width:16px;height:16px}
.lc .q{font-size:18px;margin:10px 0 14px}
.verdict{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);font-weight:600}
.verdict svg.i{width:22px;height:22px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict .vt{font-weight:500}
.lc-act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lc-act .btn{flex:1;min-width:150px}
.btn.learned{background:var(--acc-soft);border-color:transparent;color:var(--acc)}

/* flashcards */
.fc{min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:14px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;box-shadow:var(--shadow);margin-top:14px}
.fc .q{font-size:clamp(19px,2.4vw,24px);margin:0}
.fc .hintline{color:var(--mut);font-size:14px;display:flex;align-items:center;gap:8px}
.fc .answer{border-top:1px dashed var(--line);padding-top:16px;display:flex;gap:10px;align-items:flex-start;color:var(--ok);font-size:18px;font-weight:600}
.fc .answer svg.i{width:24px;height:24px;margin-top:1px}
.empty{text-align:center;padding:40px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.empty .big{font:600 44px var(--f-disp);color:var(--acc)}

/* guide */
details.guide{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:4px 20px}
details.guide summary{cursor:pointer;font-weight:600;padding:14px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.guide summary::-webkit-details-marker{display:none}
details.guide[open] summary svg{transform:rotate(90deg)}
details.guide ol{margin:0 0 16px;padding-left:22px;color:var(--mut)}details.guide li{margin:6px 0}details.guide li b{color:var(--ink)}

/* modal + zoom panel */

yicha o'quv faoliyati turlari, o'quv fanlari va kurslarining tarkibi, ularni o'rganishning izchilligi, soatlar va kreditlardagi hajmini ta'lim davrining to'liq muddati uchun belgilaydigan hujjat..","Oliy ta'limning izchilligi, soatlar va kreditlardagi hajmini ta'lim davrining to'liq muddati uchun belgilaydigan hujjat.","Oliy ta'limning tarkibi, ularni o'rganishning izchilligi, soatlar va kreditlardagi hajmini ta'lim davrining to'liq muddati uchun belgilaydigan hujjat."],"c":1},{"q":"Dual ta'limning mohiyati (tartibi) nimada ?","o":["Dual ta'lim, ta'lim oluvchining ish joyida amalga oshiriladi.","Dual ta'lim ta'lim oluvchilar tomonidan zarur bilim, malaka va ko'nikmalarni olishga qaratilgan bo'lib, ularning nazariy qismi ta'lim tashkiloti negizida, amaliy qismi esa ta'lim oluvchining ish joyida amalga oshiriladi.","Dual ta'lim ta'lim oluvchilar tomonidan amalga oshiriladigan ta'lim hisoblanadi.","Dual ta'lim, ta'lim olishga qaratilgan, ularning nazariy qismi ta'lim tashkiloti negizida, amaliy qismi esa ta'lim oluvchining ish joyida amalga oshiriladi."],"c":1},{"q":"Fuqarolik jamiyati ta'rifi to'g'ri keltirilgan javobni ko'rsating","o":["jismoniy va (yoki) yuridik shaxslar tomonidan ixtiyoriylik asosida tashkil etilgan, daromad (foyda) olishni o'z faoliyatining asosiy maqsadi qilib olmagan hamda olingan daromadlarni (foydani) o'z qatnashchilari (a'zolari) o'rtasida taqsimlamaydigan o'zini o'zi boshqarish tashkilotidir","O'z huquqlari, erkinliklarini hamda siyosat, iqtisodiyot, ijtimoiy rivojlanish, fan, madaniyat, ekologiya va hayotning boshqa sohalaridagi qonuniy manfaatlarini birgalikda ro'yobga chiqarish uchun birlashgan fuqarolarning xohish-irodalarini erkin bildirishlari natijasida vujudga kelgan ixtiyoriy tuzilma","insonga uning iqtisodiy, siyosiy va madaniy hayoti shakllarini erkin tanlash kafolatlanadigan, qonun ustuvorligi va inson huquqlari hamda erkinliklari qaror topadigan, ko?p partiyaviylik, siyosiy institutlar, mafkura va fikrlarning xilma-xilligi ta?minlanadigan hamda o?zini-o?zi boshqarish organlarining mavqei baland bo?lgan ijtimoiy tuzum","fuqarolarining qarashlar, manfaatlar va maqsadlar mushtarakligi asosida tuzilgan, davlat hokimiyati organlarini shakllantirishda jamiyat muayyan qismining siyosiy irodasini ro'yobga chiqarishga intiluvchi hamda o'z vakillari orqali davlat va jamoat ishlarini idora etishda qatnashuvchi ko'ngilli birlashmasidir"],"c":2},{"q":"Global innovatsion indeksda O'zbekiston Respublikasining o'rnini yaxshilash va 2030-yilga qadar qanday reyting qatoriga kirish rejalashtirilgan?","o":["top-30","top-50","top-100","top-10"],"c":1},{"q":"Habeas corpus nima?","o":["Insonning oʻz erkinliklari, huquqlari va manfaatlari uchun davom etgan uzoq kurashi umuminsoniy ahamiyat darajasiga koʻtarilgan meʼyoriy-huquqiy tartib","fuqaroni birinchi marta davlat organlari tomonidan biron bir ishga gumon qilinuvchi sifatida jalb qilayotganda, unga birlamchi huquqlari tushuntirib berilishi","jinoiy ta‘qibga uchragan fuqaroning adolatli sud muhokamasiga bo‘lgan huquqi","insonning davlat bilan munosabatidagi huquqiy maqomini, iqtisodiy, ijtimoiy, siyosiy va madaniy sohalardagi imkoni-yatlari hamda daʼvolarini tavsiflovchi tushuncha"],"c":2},{"q":"Har bir tuman budjetining necha foizini \"Fuqarolar budjeti\" dasturi doirasida aholining takliflari asosida eng dolzarb muammolarni yechishga sarflashni tashkil qilish belgilangan?","o":["kamida 10 foizini","kamida 5 foizini","kamida 15 foizini","kamida 20 foizini"],"c":1},{"q":"Har qanday mamlakatda inson kapitalini rivojlantirish orqali barqaror taraqqiyotni taminlaydigan muhim omil bu?","o":["taʼlim va tarbiya","taʼlimning yuqori sifati va mazmundorligi","taʼlim","milliy va umuminsoniy qadriyatlarga asoslangan tarbiya"],"c":2},{"q":"Ijtimoiy davlatning mohiyati nima?","o":["Davlat har bir inson uchun farovon turmush darajasi, xususan, sifatli ta'lim, kafolatli tibbiy xizmat, munosib mehnat sharoiti va adolatli ish haqi, pensiya va nafaqalar, ijtimoiy yordam va xizmatlar tizimi yaratilgan, uy-joyli bo'lish sharoiti mavjud bo'lgan, ijtimoiy tafovutlar yumshatilgan, muvozanatlashgan, hech bir fuqaro o'z muammolari bilan yolg'iz qolmaydigan adolatli davlatdir.","Insoniyatning ming yillar mobaynidagi mashaqqatli mehnati evaziga shakllangan taraqqiyot g'oyasi bo'lib, Konstitutsiya va qonun ustuvor bo'lgan, inson huquq va erkinliklari himoya qilingan va amalda ta'minlangan, demokratik prinsiplar asosida qabul qilingan qonunlar oldida barcha teng va hisobdor bo'lgan, hech kim qonundan ustun turmaydigan davlatdir.","Diniy tashkilotlar va birlashmalar davlatdan ajratilgan, davlat boshqaruvi diniy qoidalar bilan emas, Konstitutsiya va qonunchilik hujjatlari bilan tartibga solinadigan davlat hisoblanadi","Bu mamlakatimizda iqtisodiy, ijtimoiy va ekologik vaziyatni har tomonlama yaxshilash orqali aholining turmush farovonligini oshirish, barqaror rivojlangan jamiyat qurishdir"],"c":0},{"q":"Ijtimoiy reabilitatsiyaga muhtoj bo'lgan bolalarni (shaxslarni) o'qitish va tarbiyalashga sharoitlar yaratiladimi?","o":["Qonun hujjatlarida bunday holat ko'zda tutilmagan","Alohida sharoitlarda o'qitish va tarbiyalanishga muhtoj bo'lgan bolalar (shaxslar) uchun ularning ta'lim olishini, kasbiy tayyorgarligini va ijtimoiy reabilitatsiya qilinishini ta'minlaydigan ixtisoslashtirilgan o'quv-tarbiya muassasalari tashkil etiladi. Ozodlikdan mahrum qilish tarzida jazoni ijro etish muassasalarida saqlanayotgan bolalarning (shaxslarning) ta'lim olishi, tarbiyalanishi va mustaqil ta'lim olishi uchun sharoitlar yaratiladi.","Ozodlikdan mahrum qilish tariqasidagi jazoni o'tash muassasalarida saqlanayotgan shaxslarning ta'lim olish huquqidan mahrum bo'ladi.","Ozodlikdan mahrum qilish tariqasidagi jazoni o'tash muassasalarida saqlanayotgan shaxslarning mustaqil bilim olishga sharoitlar yaratiladi."],"c":1},{"q":"Ijtimoiy sheriklik bu?","o":["loyihani amalga oshirish va / yoki aholiga xizmat ko'rsatish uchun birgalikda ishlaydigan hukumat va bizneslarni o'z ichiga oladi","Davlat organlarining NNT va fuqarolik jamiyatining boshqa institutlari bilan mamlakatni ijtimoiy-iqtisodiy rivojlantirish dasturlarini, shu jumladan tarmoq, hududiy dasturlarni, shuningdek normativ-huquqiy hujjatlarni hamda fuqarolarning huquqlari va qonuniy manfaatlariga daxldor bo'lgan boshqa qarorlarni ishlab chiqish hamda amalga oshirish borasidagi hamkorligi","nodavlat notijorat tashkilotlari va fuqarolik jamiyati boshqa institutlari vakillarining davlat organlari huzuridagi ishchi guruhlar, komissiyalar va jamoatchilik-maslahat organlari faoliyatida ishtirok etishi","ijtimoiy sheriklik subyektlari tomonidan birgalikda tadbirlar, maslahatlashuvlar va muzokaralar o'tkazish"],"c":1},{"q":"Ikki va undan ortiq teng lavozimlarga bir vaqtda ... ?","o":["Tanlov o'tkazilmaydi. VM 2006 yil 10 fevraldagi 20-son Qarori bilan tasdiqlangan \"Oliy talim muassasalariga pedagog xodimlarni tanlov asosida ishga qabul qilish tartibi to'g'risida\"gi Nizomga ko'ra","Tanlov o'tkaziladi.","Bunday normalar normativ huquqiy hujjatlarda aks etmagan.","To'g'ri javob yo'q"],"c":0},{"q":"Inklyuziv ta'limning mohiyati (tartibi) nimada ?","o":["Individual imkoniyatlarning xilma-xilligini hisobga olgan holda olinadigan ta'lim.","Inklyuziv ta'lim alohida ta'lim olishga qaratilgan.","Inklyuziv ta'lim alohida ta'lim ehtiyojlari va individual imkoniyatlarning xilma-xilligini hisobga olgan holda barcha ta'lim oluvchilar uchun ta'lim tashkilotlarida ta'lim olishga bo'lgan teng imkoniyatlarni ta'minlashga qaratilgan.","Teng imkoniyatlarni ta'minlashga qaratilgan ta'lim."],"c":2},{"q":"Inson kapitali nima?","o":["ishlab chiqarish vositalari ko'rinishidagi ishga qo'yilgan, ishlab turgan daromad manbai","o'z egasiga daromad keltirish xususiyatiga ega bo'lgan jami vositalar va mablag'lar; yangi qiymat keltiruvchi, o'zini o'zi ko'paytiruvchi qiymat","sarflanadigan pul vositalarini ifoda etadi","bu odamning mehnatni iqtisodiy qiymatini oshiradigan tarzda bajarishi uchun yordam beradigan bilim, ko'nikma, tajriba va ijtimoiy fazilatlar yig'indisi"],"c":3},{"q":"Jamoat birlashmalariga nimalar kiradi?","o":["ommaviy harakatlar, kasaba uyushmalari, xotin-qizlar, yoshlar va bolalar tashkilotlari","ijodiy uyushmalar, yurtdoshlar uyushmalari, assotsiatsiyalar","ilmiy-texnikaviy, madaniy-ma'rifiy, jismoniy tarbiya-sport va boshqa ko'ngilli jamiyatlar","kasaba uyushmalari, siyosiy partiyalar, olimlarning jamiyatlari, xotin-qizlar tashkilotlari, faxriylar, yoshlar va nogironligi bo'lgan shaxslar tashkilotlari, ijodiy uyushmalar, ommaviy harakatlar hamda fuqarolarning boshqa birlashmalari"],"c":3},{"q":"Jamoat birlashmasi deb nimaga aytiladi?","o":["fuqarolarning o'z faoliyati yoki o'qishi turi bo'yicha umumiy kasbiy manfaatlari bilan bog'liq bo'lgan, ularning mehnatga oid, boshqa ijtimoiy-iqtisodiy huquq va manfaatlarini ifodalash hamda himoya qilish maqsadida tuziladigan, o'z ustavi asosida faoliyat ko'rsatadigan ixtiyoriy jamoat birlashmasi","jismoniy va (yoki) yuridik shaxslar tomonidan ixtiyoriylik asosida tashkil etilgan, daromad (foyda) olishni o'z faoliyatining asosiy maqsadi qilib olmagan hamda olingan daromadlarni (foydani) o'z qatnashchilari (a'zolari) o'rtasida taqsimlamaydigan o'zini o'zi boshqarish tashkilotidir","fuqarolarining qarashlar, manfaatlar va maqsadlar mushtarakligi asosida tuzilgan, davlat hokimiyati organlarini shakllantirishda jamiyat muayyan qismining siyosiy irodasini ro'yobga chiqarishga intiluvchi hamda o'z vakillari orqali davlat va jamoat ishlarini idora etishda qatnashuvchi ko'ngilli birlashmasidir","O'z huquqlari, erkinliklarini hamda siyosat, iqtisodiyot, ijtimoiy rivojlanish, fan, madaniyat, ekologiya va hayotning boshqa sohalaridagi qonuniy manfaatlarini birgalikda ro'yobga chiqarish uchun birlashgan fuqarolarning xohish-irodalarini erkin bildirishlari natijasida vujudga kelgan ixtiyoriy tuzilma"],"c":3},{"q":"Jamoatchilik nazorati subyektlari bu","o":["Jamoat birlashmalari va siyosiy partiyalar","O'zbekiston Respublikasi fuqarolari, fuqarolarning o'zini o'zi boshqarish organlari, shuningdek qonunchilikda belgilangan tartibda ro'yxatga olingan nodavlat notijorat tashkilotlari, ommaviy axborot vositalari","Ommaviy axborot vositalari, jurnalistlar va blogerlar","O'zbekiston Respublikasi fuqarolari, fuqaroligi bo'lmagan shaxslar va chet el fuqarolari"],"c":1},{"q":"Jismoniy, aqliy, sensor (sezgi) yoki ruhiy nuqsonlari bo'lgan bolalarni (shaxslarni) o'qitish hamda tarbiyalash, o'qitish qanday ta'minotida bo'ladi?","o":["Davlat jismoniy, aqliy, sensor (sezgi) yoki ruhiy nuqsonlari bo'lgan bolalarning (shaxslarning) davlat ixtisoslashtirilgan ta'lim muassasalarida, umumiy o'rta, o'rta maxsus, professional ta'lim muassasalarida inklyuziv shaklda bepul umumiy o'rta, o'rta maxsus, professional va maktabdan tashqari ta'lim olishini ta'minlaydi.","Ixtisoslashtirilgan ta'lim muassasalarining o'quvchilari 20 foiz davlat ta'minotida bo'ladi","Ixtisoslashtirilgan ta'lim muassasalarining o'quvchilari 40 foiz davlat ta'minotida bo'ladi","Ruhiy nuqsonlari bo'lgan bolalarning (shaxslarning) davlat ixtisoslashtirilgan ta'lim muassasalarida, umumiy o'rta, o'rta maxsus, professional ta'lim muassasalarida inklyuziv shaklda pulllik (haq to'lanadi) umumiy o'rta, o'rta maxsus, professional va maktabdan tashqari ta'lim olishini ta'minlaydi."],"c":0},{"q":"Kimlar pedagogik faoliyat bilan shug'ullanish huquqiga ega?","o":["Tegishli ma'lumoti bo'lgan shaxslar","Kasb tayyorgarligi bor shaxslar","Ma'naviy-axloqiy fazilatlarga ega shaxslar","Hammasi to'g'ri"],"c":3},{"q":"Konstitutsiya so'zi qanday ma'noni anglatadi?","o":["yunon tilidan - maqsadni aytmoq","ingliz tilidan constitute - gapirmoq","lotincha so'z bo'lib, tartib, qoida, tuzish","fransuz tilidan tartib-taomil"],"c":2},{"q":"Konstitutsiyamizda (51-modda) \"akademik erkinlik\", degan qoida belgilangan. Akademik erkinlikning mohiyatini ko'rsating?","o":["O'z fikrini erkin bildirish huquqi.","Bu oliy ta'lim tashkilotlarida o'quv jarayonini tashkil etish va ilmiy tadqiqotlar o'tkazish, tashkiliy-boshqaruv, moliyaviy va faoliyati bilan bog'liq boshqa masalalar bo'yicha qaror qabul qilishdagi mustaqilligi va javobgarligini anglatadi.","O'quv jarayonini mustaqil shakllantirish, professor-o'qituvchilarni dars o'tish erkinligida, ilmiy-tadqiqot mavzularini mustaqil tanlash va tadqiq etish, uning natijalarini nashr etish va tarqatish, professor-o'qituvchilar va ilmiy xodimlar akademik erkinligining cheklanmasligida va boshqalarda namoyon bo'ladi.","O'z fikrini erkin bildirish huquqining tarkibiy qismi bo'lib, oliy ta'lim tashkilotlarida ta'lim berish va ilmiy-tadqiqot o'tkazish erkinligidir. Ushbu erkinlik o'quv jarayonini mustaqil shakllantirish, professor-o'qituvchilarni dars o'tish erkinligida, ilmiy-tadqiqot mavzularini mustaqil tanlash va tadqiq etish, uning natijalarini nashr etish va tarqatish, professor-o'qituvchilar va ilmiy xodimlar akademik erkinligining cheklanmasligida va boshqalarda namoyon bo'ladi."],"c":3},{"q":"Legal Tech platformasi nima?","o":["Advokatlar palatasi boshqaruv organlarining tizimi","Sudlar, huquqni muhofaza qiluvchi organlar va boshqa davlat organlari bilan elektron hujjatlar almashinuvi tizimi","Tadbirkorlar va aholi, ayniqsa uning kam ta'minlangan qatlamlari uchun huquqiy hujjatlarni yurist ishtirokisiz tayyorlash imkonini beruvchi tizim","Huquqni muhofaza qiluvchi organlarda jinoyatlar haqida xabarlarni hisobga olish tizimi"],"c":2},{"q":"Ma'naviy tarbiyani baholashning ilmiy asoslangan indikatorlarini ishlab chiqish qaysi ustuvor yo'nalish maqsadlarida belgilangan?","o":["ma'naviy taraqqiyotni ta'minlash va sohani yangi bosqichga olib chiqish","adolatli ijtimoiy siyosat yuritish, inson kapitalini rivojlantirish","mamlakatimizda adolat va qonun ustuvorligi tamoyillarini taraqqiyotning eng asosiy va zarur shartiga aylantirish","milliy iqtisodiyotni jadal rivojlantirish va yuqori o'sish sur'atlarini ta'minlash"],"c":0},{"q":"Ma'naviyat bu","o":["inson axloqi va odobi, bilimlari, iste'dodi, amaliy malakalari, vijdoni, iymoni, e'tiqodi, dunyoqarashi, mafkuraviy qarashlarning bir-biri bilan uzviy bog'langan, jamiyat taraqqiyotiga ijobiy ta'sir etadigan mushtarak tizimidir","kishilarning ongini, bilimini, madaniyatini oshirishga qaratilgan ta?lim-tarbiya tizimi","inson faoliyati va shu faolliyatning ahamiyatini belgilovchi ramziy qurilmalar va asarlar majmuidir","shaxsda muayyan jismoniy, ruhiy, axloqiy, ma?naviy sifatlarni shakllantirishga qaratilgan amaliy pedagogik jarayon; insonning jamiyatda yashashi uchun zarur bo?lgan xususiyatlarga ega bo?lishini ta?minlash yo?lida ko?riladigan chora tadbirlar yigindisi"],"c":0},{"q":"Ma'ruza mashg'ulotlari ilmiy unvon va ilmiy darajaga ega bo'lgan professor-o'qituvchilar tomonidan o'tkaziladi. Zarur hollarda qanday tartibi belgilangan?","o":["Zarur hollarda 2 yillik ilmiy-pedagogik ish stajiga ega bo'lgan, biroq ilmiy unvon va ilmiy darajasi bo'lmagan o'qituvchilar tomonidan o'tkaziladi.","Zarur hollarda ma'ruza mashg'ulotlari professor tomonidan o'tkaziladi.","Zarur hollarda (ma'ruza mashg'ulotlari hajmi ko'p bo'lganda yoki professor, dotsent va katta o'qituvchilar yetarli bo'lmaganda) oliy ta'lim muassasasi Kengashining qaroriga asosan kamida 3 yillik ilmiy-pedagogik ish stajiga ega bo'lgan, biroq ilmiy unvon va ilmiy darajasi bo'lmagan o'qituvchilarga bir o'quv yilida 250 soatgacha hajmda ma'ruza mashg'ulotlarini o'tishga ruxsat beriladi.","Kengashining qaroriga asosan kamida 1 yillik ilmiy-pedagogik ish stajiga ega bo'lgan, biroq ilmiy darajasi bo'lmagan o'qituvchilarga bir o'quv yilida 100 soatgacha hajmda ma'ruza mashg'ulotlarini o'tishga ruxsat beriladi."],"c":2},{"q":"Mamlakatimiz xavfsizligi va mudofaa salohiyatini kuchaytirish, ochiq, pragmatik va faol tashqi siyosat olib borish sohasidagi ustuvor yo'nalishlarda amalga oshirilgan chora-tadbirlarni ko'rsating","o":["Inson a'zolari va to'qimalarining transplantatsiyasi to'g'risida 11.05.2022 yildagi O'RQ-768-son qonun qabul qilindi.","Kiberxavfsizlik to'g'risidagi 15.04.2022 yildagi O'RQ-764-sonli qonun qabul qilindi","2022 yil 27 yanvarda O'zbekiston Respublikasi Prezidentining \"Xizmatlar sohasini rivojlantirishga oid qo'shimcha chora-tadbirlar to'g'risida\"gi qarori qabul qilindi.","29.03.2022 yildagi \"O'zbekiston Respublikasining Fuqarolik kodeksiga qiynoqqa solishdan jabrlanganlarga yetkazilgan zararni qoplash tartibini takomillashtirishga qaratilgan qo'shimchalar kiritish to'g'risida\"gi qonun qabul qilindi"],"c":1},{"q":"Milliy iqtisodiyotni jadal rivojlantirish va yuqori o'sish sur'atlarini ta'minlashning ustuvor yo'nalishlarida amalga oshirilgan chora-tadbirlarni ko'rsating","o":["2022 yil 27 yanvarda O'zbekiston Respublikasi Prezidentining \"Xizmatlar sohasini rivojlantirishga oid qo'shimcha chora-tadbirlar to'g'risida\"gi qarori qabul qilindi.","2022 yil 29 iyunda O'zbekiston Respublikasi Prezidentining \"Ozodlikdan mahrum etish jazosini o'tab bo'lgan fuqarolarning ijtimoiy moslashuviga ko'maklashish tizimini takomillashtirish chora-tadbirlari to'g'risida\"gi qarori qabul qilindi","2022 yil 13 oktyabrda Vazirlar Mahkamasining \"O'zbekiston Respublikasi Mudofaa vazirligi qo'shinlarida xotin-qizlar va harbiy xizmatchilarning oila a'zolari bilan ishlash tizimining samaradorligini oshirish chora-tadbirlari to'g'risida\"gi 590-sonli qarori qabul qilindi.","2022 yil 11 mayda O'zbekiston Respublikasi Prezidentining \"2022-2026 yillarda xalq ta'limini rivojlantirish bo'yicha milliy dasturni tasdiqlash to'g'risida\"gi Farmoni qabul qilindi."],"c":0},{"q":"Miranda qoidasi bu","o":["“tanani sudga keltirish”, ya‘ni jinoiy ta‘qibga uchragan fuqaroning adolatli sud muhokamasiga bo‘lgan huquqining tarixan eng qadimiy e‘tiroflaridan biri","fuqaroni birinchi marta davlat organlari tomonidan biron bir ishga gumon qilinuvchi sifatida jalb qilayotganda, unga birlamchi huquqlari tushuntirib berilishi","Insonning oʻz erkinliklari, huquqlari va manfaatlari uchun davom etgan uzoq kurashi umuminsoniy ahamiyat darajasiga koʻtarilgan meʼyoriy function cnHint(i){const v=parseInt($('#cn'+i).value,10),max=DATA[i].q.length,f=$('#cf'+i),h=$('#ch'+i);
  f.classList.remove('err');h.textContent=v>0?(v>max?`Ko'pi bilan ${max} ta`:`${v} daqiqa`):`1–${max} ta`;if(v>max)f.classList.add('err')}
function startCustom(i){const v=parseInt($('#cn'+i).value,10),max=DATA[i].q.length;
  if(!(v>=1&&v<=max)){$('#cf'+i).classList.add('err');$('#ch'+i).textContent=`1 dan ${max} gacha son yozing`;$('#cn'+i).focus();return}
  startModule(i,v>=max?0:v)}
function pick(mi,n){const idx=shuf(DATA[mi].q.map((_,i)=>i));return (n?idx.slice(0,n):idx).sort((a,b)=>a-b).map(i=>({m:mi,i}))}
let lastMk=null;

function startModule(mi,n){lastMk=()=>startModule(mi,n);const qs=pick(mi,n);runExam(DATA[mi].s+', '+(n?n+' ta':'hammasi'),qs,qs.length*60,false)}
function hardList(){return Object.keys(st.cnt).filter(k=>st.cnt[k]>0).sort((a,b)=>st.cnt[b]-st.cnt[a])}
function hardTest(){lastMk=hardTest;const qs=hardList().slice(0,30).map(k=>{const[m,i]=k.split('_').map(Number);return{m,i}}).filter(x=>DATA[x.m]&&DATA[x.m].q[x.i]).sort(byNum);if(!qs.length)return;runExam('Qiyin savollar',qs,qs.length*60,false)}
function wrongTest(){lastMk=wrongTest;const qs=Object.keys(st.wrong).map(k=>{const[m,i]=k.split('_').map(Number);return{m,i}}).filter(x=>DATA[x.m]&&DATA[x.m].q[x.i]).sort(byNum);if(!qs.length)return;runExam('Xatolarim ustida ishlash',qs,qs.length*60,false)}

/* ---------- EXAM ---------- */
let ex;
function runExam(name,qs,secs,general){
  ex={name,general,cur:0,end:Date.now()+secs*1000,items:qs.map(x=>({...x,ord:optOrder(x.m,x.i),ans:null}))};save();
  setHead(name,async()=>{if(await dlg('Testdan chiqasizmi? Natija saqlanmaydi.','Ha, chiqish',"Yo'q"))testMenu()});
  stopTimer();$('#timer').classList.remove('hidden');tick();timerInt=setInterval(tick,1000);
  showQ();
}
function tick(){const s=Math.max(0,Math.round((ex.end-Date.now())/1000));const t=$('#timer');t.innerHTML=ic('clock')+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');t.classList.toggle('low',s<60);if(s<=0){stopTimer();finish();dlg("Vaqt tugadi. Natijangiz ko'rsatildi.",'OK')}}
function showQ(){
  const it=ex.items[ex.cur],q=DATA[it.m].q[it.i],n=ex.items.length,done=ex.items.filter(x=>x.ans!==null).length;
  app.innerHTML=`<div class="qhead"><span class="qn">Savol <b>${ex.cur+1}</b> / ${n}</span><span class="mut sm">${done} ta javob berildi</span></div>
   <div class="prog"><i style="width:${done/n*100}%"></i></div>
   ${ex.general?`<span class="modtag">${esc(DATA[it.m].s)}</span>`:''}
   <article class="qcard"><h2 class="q">${esc(q.q)}</h2><div class="opts">${it.ord.map((k,j)=>`<button class="opt ${it.ans===k?'sel':''}" onclick="ans(${k})"><span class="l">${L[j]}</span><span class="ot">${esc(q.o[k])}</span></button>`).join('')}</div></article>
   <details class="map"><summary>${ic('chev')} Savollar xaritasi</summary><div class="grid">${ex.items.map((x,j)=>`<button class="${x.ans!==null?'a':''} ${j===ex.cur?'cur':''}" onclick="go(${j})">${j+1}</button>`).join('')}</div></details>`;
  foot(`<button class="btn" onclick="go(${ex.cur-1})" ${ex.cur?'':'disabled'}>${ic('back')} Oldingi</button>`+(ex.cur<n-1?`<button class="btn p" onclick="go(${ex.cur+1})">Keyingi ${ic('chev')}</button>`:'')+`<button class="btn" onclick="askFinish()">${ic('check')} Yakunlash</button>`);
}
function ans(k){ex.items[ex.cur].ans=k;if(ex.cur<ex.items.length-1)setTimeout(()=>go(ex.cur+1),220);showQ()}
function go(j){if(j<0||j>=ex.items.length)return;ex.cur=j;showQ();top0()}
async function askFinish(){const left=ex.items.filter(x=>x.ans===null).length;if(await dlg(left?`${left} ta savolga javob berilmagan. Yakunlaysizmi?`:'Testni yakunlaysizmi?','Ha, yakunlash','Davom etish'))finish()}
function finish(){
  stopTimer();let s=0;
  ex.items.forEach(x=>{const q=DATA[x.m].q[x.i],ok=x.ans===q.c;if(ok){s++;delete st.wrong[key(x.m,x.i)]}else miss(key(x.m,x.i))});
  const t=ex.items.length,p=Math.round(s/t*100),d=new Date();
  const h={n:ex.name,s,t,p,g:!!ex.general,d:d.toLocaleDateString('uz')+' '+d.toTimeString().slice(0,5),it:ex.items.map(x=>({m:x.m,i:x.i,a:x.ans}))};
  st.hist.push(h);st.hist=st.hist.slice(-30);save();
  renderResult(h,true);
  foot(`<button class="btn" onclick="home()">${ic('home')} Bosh sahifa</button>${lastMk?`<button class="btn p" onclick="lastMk()">${ic('repeat')} Qayta ishlash</button>`:''}<button class="btn" onclick="testMenu()">Yangi test</button>`);
}
function renderResult(h,tips){
  const gr=grade(h.p);setHead(tips?'Natija':'Natija tahlili',tips?testMenu:home);
  const items=(h.it||[]).map(x=>{const q=DATA[x.m]&&DATA[x.m].q[x.i];return q?{...x,q,ok:x.a===q.c}:null}).filter(Boolean);
  const bad=items.filter(x=>!x.ok).length, skip=items.filter(x=>x.a==null).length;
  let html=`<section class="result" style="--gc:${gr[1]}"><div class="ring">${ring(h.p)}<div class="ring-tx"><b>${h.p}%</b><span>natija</span></div></div>
   <div><div class="gname">${gr[0]}</div><div class="meta">${esc(h.n)} · ${esc(h.d)}</div>
   <div class="nums"><div><b>${h.s}</b><span>to'g'ri</span></div><div><b>${h.t-h.s}</b><span>xato</span></div>${h.it?`<div><b>${skip}</b><span>javobsiz</span></div>`:''}<div><b>${h.t}</b><span>jami</span></div></div></div></section>`;
  if(!h.it){app.innerHTML=html+`<p class="mut" style="margin-top:16px">Bu test ilovaning oldingi versiyasida ishlangan, shuning uchun savollar tafsiloti saqlanmagan. Bundan keyingi testlaringiz to'liq ko'rinadi.</p>`;foot(`<button class="btn p" onclick="home()">${ic('home')} Bosh sahifa</button>`);top0();return}
  if(h.g){const by={};items.forEach(x=>{by[x.m]=by[x.m]||[0,0];by[x.m][1]++;if(x.ok)by[x.m][0]++});
    html+=`<h2>Modullar bo'yicha</h2><div class="list">`+Object.keys(by).map(m=>{const[a,b]=by[m],r=a/b;return`<div class="row-i"><span class="tx"><b>${esc(DATA[m].s)}</b><div class="bar"><i style="width:${r*100}%;background:${r>=.7?'var(--ok)':r>=.5?'var(--warn)':'var(--bad)'}"></i></div></span><span class="score-pill ${spc(r*100)}">${a} / ${b}</span></div>`}).join('')+`</div>`}
  html+=`<h2>Javoblar tahlili</h2><div class="grid">${items.map((x,j)=>`<button class="${x.ok?'g':'r'}" onclick="rvShow(0);document.getElementById('rv${j}').scrollIntoView({behavior:'smooth',block:'center'})">${j+1}</button>`).join('')}</div>
   <div class="seg" id="rvseg"><button class="${bad?'on':''}" onclick="rvShow(1)">Faqat xatolar (${bad})</button><button class="${bad?'':'on'}" onclick="rvShow(0)">Hammasi (${items.length})</button></div>
   <div id="rv">${bad?'':`<p class="mut">Barcha javoblar to'g'ri. Barakalla!</p>`}${items.map((x,j)=>`<div class="rv-i ${x.ok?'okk'+(bad?' hidden':''):''}" id="rv${j}">
     ${x.ok?`<span class="st ok">${ic('check')} ${j+1}. To'g'ri</span>`:x.a==null?`<span class="st nt">${j+1}. Javob berilmagan</span>`:`<span class="st no">${ic('x')} ${j+1}. Xato</span>`}
     <div class="q">${esc(x.q.q)}</div>
     ${x.a!=null&&!x.ok?`<div class="ans no">${ic('x')}<span>Sizning javobingiz: ${esc(x.q.o[x.a])}</span></div>`:''}
     <div class="ans ok">${ic('check')}<span>To'g'ri javob: ${esc(x.q.o[x.q.c])}</span></div>
     ${tips&&!x.ok?tipHTML(x.m,x.i):''}</div>`).join('')}</div>`;
  app.innerHTML=html;top0();
}
function rvShow(w){document.querySelectorAll('.okk').forEach(e=>e.classList.toggle('hidden',!!w));const b=$('#rvseg').children;b[0].classList.toggle('on',!!w);b[1].classList.toggle('on',!w)}
function reviewHist(idx){const h=st.hist[idx];if(!h)return;stopTimer();renderResult(h,false);
  if(h.it)foot(`<button class="btn" onclick="home()">${ic('home')} Bosh sahifa</button><button class="btn p" onclick="testMenu()">Test ishlash</button>`)}

/* ---------- LEARN ---------- */
function learnMenu(){
  stopTimer();foot();setHead('Test yodlash',home);
  app.innerHTML=`<p class="mut">Fanni tanlang. <b style="color:var(--ink)">Ro'yxat</b>da barcha savollar chiqadi: javobni belgilaysiz va to'g'ri yoki xato ekanini ko'rasiz. <b style="color:var(--ink)">Kartochka</b>da savol chiqadi, bosganda javob ochiladi, bilmaganlaringiz qayta chiqadi.</p>
  <div class="list" style="margin-top:16px">${DATA.map((m,i)=>{const l=m.q.filter((_,j)=>st.learned[key(i,j)]).length;return`<div class="mrow">
    <div class="mnum">${i+1}</div>
    <div class="mtx"><b>${esc(m.t)}</b><span>${l} / ${m.q.length} yodlangan</span><div class="bar"><i style="width:${l/m.q.length*100}%"></i></div></div>
    <div class="mact"><button class="btn" onclick="learn(${i})">${ic('list')} Ro'yxat</button><button class="btn p" onclick="fcStart(${i})">${ic('cards')} Kartochka</button></div></div>`}).join('')}</div>`;
  top0();
}
let ln;
function learn(mi){
  ln={mi,f:'all',s:'',shown:{},ord:DATA[mi].q.map((_,i)=>optOrder(mi,i))};save();
  setHead(DATA[mi].s,learnMenu);
  app.innerHTML=`<p class="mut">${esc(DATA[mi].t)}</p>
   <div class="seg" id="lf" style="margin-top:14px;flex-wrap:wrap"><button class="on" data-f="all">Hammasi</button><button data-f="new">Yodlanmagan</button><button data-f="wrong">Xato qilinganlar</button><button data-f="done">Yodlangan</button></div>
   <div class="toolbar"><label class="search">${ic('search')}<input type="search" id="ls" placeholder="Savol yoki javobdan qidirish"></label>
   <label class="check"><input type="checkbox" id="lshow"> Javoblarni darhol ko'rsatish</label></div>
   <div id="lst"></div>`;
  $('#lf').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;ln.f=b.dataset.f;[...$('#lf').children].forEach(x=>x.classList.toggle('on',x===b));renderL()};
  $('#ls').oninput=e=>{ln.s=e.target.value.toLowerCase();renderL()};
  $('#lshow').onchange=renderL;
  foot(`<button class="btn" onclick="top0()">Tepaga</button><button class="btn p" onclick="startModule(${mi},10)">${ic('test')} Shu fandan 10 ta test</button>`);
  renderL();top0();
}
function renderL(){
  const m=DATA[ln.mi],show=$('#lshow').checked;
  const list=m.q.map((q,i)=>({q,i})).filter(({q,i})=>{const k=key(ln.mi,i);
    if(ln.f==='new'&&st.learned[k])return false;if(ln.f==='wrong'&&!st.wrong[k])return false;if(ln.f==='done'&&!st.learned[k])return false;
    if(ln.s&&!(q.q+' '+q.o.join(' ')).toLowerCase().includes(ln.s))return false;return true});
  $('#lst').innerHTML=list.length?list.map(({i})=>lcard(i,show)).join(''):`<div class="empty" style="margin-top:12px"><p class="mut">Bu bo'limda hozircha savol yo'q.</p></div>`;
}
function lcard(i,show){
  const q=DATA[ln.mi].q[i],k=key(ln.mi,i),sel=ln.shown[i],ansd=sel!==undefined||show;
  return`<div class="lc" id="lc${i}"><div class="lc-h"><span class="qno">${i+1}-savol</span>${st.learned[k]?`<span class="done-badge">${ic('check')} Yodlangan</span>`:''}</div>
   <div class="q">${esc(q.q)}</div>
   <div class="opts">${ln.ord[i].map((j,p)=>{let c='';if(ansd){if(j===q.c)c='ok';else if(j===sel)c='no'}return`<button class="opt ${c}" ${ansd?'disabled':''} onclick="lans(${i},${j})"><span class="l">${L[p]}</span><span class="ot">${esc(q.o[j])}</span></button>`}).join('')}</div>
   ${sel!==undefined?(sel===q.c?`<div class="verdict ok">${ic('check')} To'g'ri</div>`:`<div class="verdict no">${ic('x')} Xato</div>`):''}
   ${ansd?`<div class="lc-act"><button class="btn" onclick="lreset(${i})">${ic('undo')} Qayta belgilash</button><button class="btn ${st.learned[k]?'learned':'p'}" onclick="ltog(${i})">${st.learned[k]?ic('check')+' Yodlangan':'Yodladim'}</button></div>`:''}</div>`;
}
function lans(i,j){ln.shown[i]=j;const k=key(ln.mi,i);if(j===DATA[ln.mi].q[i].c)delete st.wrong[k];else{miss(k);delete st.learned[k]}save();$('#lc'+i).outerHTML=lcard(i,$('#lshow').checked)}
function lreset(i){delete ln.shown[i];ln.ord[i]=optOrder(ln.mi,i);save();$('#lc'+i).outerHTML=lcard(i,false)}
function ltog(i){const k=key(ln.mi,i);if(st.learned[k])delete st.learned[k];else st.learned[k]=1;save();$('#lc'+i).outerHTML=lcard(i,$('#lshow').checked)}

/* ---------- FLASHCARDS ---------- */
let fc;
function fcStart(mi,all){
  const m=DATA[mi];let idx=m.q.map((_,i)=>i);
  const nl=idx.filter(i=>!st.learned[key(mi,i)]);
  if(!all&&nl.length)idx=nl;
  idx=shuf(idx);const w=idx.filter(i=>st.wrong[key(mi,i)]);idx=w.concat(idx.filter(i=>!st.wrong[key(mi,i)]));
  fc={ord:{},mi,deck:idx,total:idx.length,known:0,flip:false,miss:{}};
  setHead('Kartochka: '+m.s,learnMenu);fcShow();
}
function fcShow(){
  const m=DATA[fc.mi];
  if(!fc.deck.length){const bad=Object.keys(fc.miss).length;
    app.innerHTML=`<div class="empty"><div class="big">${fc.total}</div><h2 style="margin-top:6px">Kartochkalar tugadi</h2><p class="mut">${bad?bad+" tasini birinchi urinishda bilmadingiz, ular «Xato qilinganlar»ga qo'shildi.":'Hammasini birinchi urinishda bildingiz.'}</p></div>`;
    foot(`<button class="btn" onclick="learnMenu()">Fanlar</button><button class="btn" onclick="fcStart(${fc.mi},true)">${ic('repeat')} Hammasini qayta</button><button class="btn p" onclick="startModule(${fc.mi},10)">10 ta test</button>`);top0();return}
  const i=fc.deck[0],q=m.q[i],done=fc.total-fc.deck.length;
  app.innerHTML=`<div class="qhead"><span class="qn">Qoldi <b>${fc.deck.length}</b></span><span class="mut sm">Bildim: ${fc.known} / ${fc.total}</span></div>
   <div class="prog"><i style="width:${done/fc.total*100}%;background:var(--acc)"></i></div>
   <div class="fc" id="fcc" onclick="fcFlip()"><span class="qno">${i+1}-savol${fc.miss[i]?' · takror':''}</span><div class="q">${esc(q.q)}</div>
    ${fc.flip?`<div class="answer">${ic('check')}<span>${esc(q.o[q.c])}</span></div>`:`<div class="hintline">Javobni o'ylab ko'ring, keyin kartochkani bosing</div>`}</div>
   ${fc.flip?`<details class="map"><summary>${ic('chev')} Barcha variantlar</summary><div class="opts" style="padding-bottom:14px">${(fc.ord[i]||(fc.ord[i]=optOrder(fc.mi,i))).map((j,p)=>`<div class="opt ${j===q.c?'ok':''}" style="cursor:default"><span class="l">${L[p]}</span><span class="ot">${esc(q.o[j])}</span></div>`).join('')}</div></details>`:''}`;
  foot(fc.flip?`<button class="btn danger" onclick="fcAns(0)">${ic('x')} Bilmasdim</button><button class="btn p" onclick="fcAns(1)">${ic('check')} Bilardim</button>`
              :`<button class="btn p" onclick="fcFlip()">Javobni ko'rish</button>`);
}
function fcFlip(){if(fc.flip)return;fc.flip=true;fcShow()}
function fcAns(ok){
  const i=fc.deck.shift(),k=key(fc.mi,i);fc.flip=false;
  if(ok){fc.known++;st.learned[k]=1;if(!fc.miss[i])delete st.wrong[k]}
  else{fc.miss[i]=1;miss(k);delete st.learned[k];fc.deck.splice(Math.min(3,fc.deck.length),0,i)}
  save();fcShow();top0();
}
document.addEventListener('keydown',e=>{if(!fc||!document.getElementById('fcc'))return;if(e.code==='Space'){e.preventDefault();fcFlip()}else if(fc.flip&&e.key==='ArrowRight')fcAns(1);else if(fc.flip&&e.key==='ArrowLeft')fcAns(0)});

/* ---------- MEMORY TIPS ---------- */
const STOP=new Set('va bu bilan uchun qaysi qanday nima nimani necha nechta deb bo\'lgan bo\'lib holda hamda yoki ham esa ushbu shu bir har ular uning o\'z ko\'rsating toping belgilang javobni to\'g\'ri berilgan keltirilgan aniqlang tushunchasi degan ataladi nomlanadi deyiladi nomini qilish etish orqali asosida kabi boshqa barcha hamma dan ga ning the and'.split(' '));
const norm=w=>w.toLowerCase().replace(/[ʻʼ‘’`´]/g,"'").replace(/[^a-z0-9'а-яёўқғҳ]/gi,'');
const words=s=>s.split(/[\s,.;:()«»"“”!?\/—–-]+/).map(norm).filter(w=>w.length>2&&!STOP.has(w));
const stem=w=>w.slice(0,Math.max(4,Math.ceil(w.length*.7)));
function tipHTML(mi,i){
  const q=DATA[mi].q[i],c=q.o[q.c],tips=[];
  const qw=words(q.q),cw=words(c);
  // 1. mos so'zlar
  const shared=[...new Set(cw.filter(w=>w.length>3&&qw.some(x=>stem(x)===stem(w))))];
  if(shared.length)tips.push(`Savol va javobda bir xil o'zak bor: ${shared.slice(0,3).map(w=>'<mark>'+esc(w)+'</mark>').join(', ')} — shu so'z sizni to'g'ri javobga olib boradi.`);
  // 2. eng o'xshash noto'g'ri variantdan farq
  let best=null,bs=-1;q.o.forEach((o,j)=>{if(j===q.c)return;const ow=words(o);const sim=cw.filter(w=>ow.includes(w)).length/Math.max(1,new Set([...cw,...ow]).size);if(sim>bs){bs=sim;best=ow}});
  if(best&&bs>=.3){const d=[...new Set(cw.filter(w=>!best.includes(w)))].slice(0,4);if(d.length)tips.push(`Chalg'ituvchi variant bilan juda o'xshash! Farqi — to'g'ri javobda: ${d.map(w=>'<mark>'+esc(w)+'</mark>').join(', ')}.`)}
  // 3. raqamlar
  const nums=c.match(/\d+(?:[.,]\d+)?/g);
  if(nums){tips.push(`Raqamni yodlang: <mark>${esc(nums.join(', '))}</mark>. Uni savol bilan birga baland ovozda 3 marta ayting: «${esc(short(q.q,8))} — ${esc(nums.join(', '))}».`)}
  // 4. uzunlik qoidasi
  const lens=q.o.map(o=>o.length),mx=Math.max(...lens);
  if(c.length===mx&&c.length>40&&lens.filter(x=>x===mx).length===1)tips.push(`To'g'ri javob — eng to'liq va batafsil ta'rif. Bu fanda ko'pincha shunday bo'ladi.`);
  // 5. qisqa javob / qisqartma
  if(c.length<=25&&!nums){const ab=c.match(/\b[A-Z][A-Za-z]{1,6}\b/g);
    if(ab&&/[A-Z]{2,}/.test(c))tips.push(`Qisqartma: <mark>${esc(c)}</mark>. Har bir harfini ma'noga bog'lab oling va savolni ko'rganda shu qisqartmani esga oling.`);
    else tips.push(`Javob qisqa: <mark>${esc(c)}</mark>. Savolning kalit so'zini (${esc(qw.slice(0,2).join(', ')||'savol')}) shu javob bilan juftlik qilib yodlang.`)}
  // 6. kalit juftlik
  if(tips.length<2){const kq=qw.filter(w=>w.length>4).slice(0,2),kc=cw.filter(w=>w.length>4).slice(0,2);if(kq.length&&kc.length)tips.push(`Kalit juftlik: <mark>${esc(kq.join(' '))}</mark> → <mark>${esc(kc.join(' '))}</mark>. Faqat shu juftlikni eslab qolsangiz yetarli.`)}
  tips.push(`Takrorlash: bugun, 1 kundan keyin va 3 kundan keyin qayta ishlang — shunda uzoq xotirada qoladi.`);
  return`<div class="tip"><b>💡 Eslab qolish uchun maslahat</b><ul>${tips.map(t=>'<li>'+t+'</li>').join('')}</ul></div>`;
}
function short(s,n){const w=s.replace(/^[\s.…\-]+/,'').split(/\s+/);return w.slice(0,n).join(' ')+(w.length>n?'…':'')}



/* ---------- THEME ---------- */
(function(){const r=document.documentElement,b=document.getElementById('thm');let t=null;try{t=localStorage.getItem('mo_theme')}catch(e){}
 const sys=()=>window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
 const cur=()=>t||sys();
 const apply=()=>{r.setAttribute('data-theme',cur());b.innerHTML=ic(cur()==='dark'?'sun':'moon');document.querySelector('meta[name=theme-color]').content=cur()==='dark'?'#0c131c':'#1f3fa6'};
 b.onclick=()=>{t=cur()==='dark'?'light':'dark';try{localStorage.setItem('mo_theme',t)}catch(e){}apply()};apply();})();
document.getElementById('back').innerHTML=ic('back');
/* ---------- ZOOM / WIDTH ---------- */
(function(){let z=1,w='full';try{const v=JSON.parse(localStorage.getItem('mo_view')||'{}');z=v.z||1;w=v.w||'full'}catch(e){}
 const W={narrow:'860px',wide:'1200px',full:'100%'},r=document.documentElement;
 const apply=()=>{document.body.style.zoom=z;r.style.setProperty('--mw',W[w]);try{localStorage.setItem('mo_view',JSON.stringify({z,w}))}catch(e){}const p=document.getElementById('zp');if(p)draw(p)};
 const draw=p=>{p.innerHTML=`<div class="lbl">Shrift o'lchami</div><div class="zr"><button class="btn" data-z="-1" aria-label="Kichraytirish">A−</button><span class="val">${Math.round(z*100)}%</span><button class="btn" data-z="1" aria-label="Kattalashtirish">A+</button></div>
   <div class="lbl">Ekran kengligi</div><div class="seg">${[['narrow','Tor'],['wide','Keng'],['full',"To'liq"]].map(([k,t])=>`<button class="${w===k?'on':''}" data-w="${k}">${t}</button>`).join('')}</div>
   <button class="btn reset" data-z="0">Asl holatiga qaytarish</button>`};
 document.getElementById('zoomb').onclick=e=>{e.stopPropagation();let p=document.getElementById('zp');if(p){p.remove();return}
   p=document.createElement('div');p.id='zp';p.className='zp';draw(p);document.body.appendChild(p);
   p.onclick=ev=>{ev.stopPropagation();const b=ev.target.closest('button');if(!b)return;
     if(b.dataset.z!==undefined){const s=+b.dataset.z;z=s===0?1:Math.min(3,Math.max(.7,Math.round((z+s*.1)*10)/10));if(s===0)w='full'}
     if(b.dataset.w)w=b.dataset.w;apply()}};
 document.addEventListener('click',()=>{const p=document.getElementById('zp');if(p)p.remove()});
 apply();})();
home();
</script>
